<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Warga</title>
<!-- Library untuk membuat PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f4f6f8; padding-bottom: 50px;}
  h1 { font-size: 22px; color: #1a5e3a; text-align: center; margin-bottom: 20px;}
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 10px; margin-bottom: 4px;}
  input, select { font-size: 15px; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #1a5e3a; color: #fff; border: none; font-weight: bold; cursor: pointer; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; margin-top: 15px; }
  button:active { background: #124229; }
  button:disabled { background: #888; }
  
  /* Styling Dashboard */
  .menu-btn { background: #0d6efd; margin-top: 10px; }
  .menu-btn-2 { background: #6c757d; margin-top: 10px; }
  
  /* Styling Tabel */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background-color: #1a5e3a; color: white; }
  tr:nth-child(even) { background-color: #f2f2f2; }
  
  .hidden { display: none; }
  .success { color: #1a7f37; text-align: center; font-weight: bold; margin-top: 10px; display: none; }
</style>
</head>
<body>

  <!-- ================= DASHBOARD ================= -->
  <div id="dashboard">
    <h1>📋 Menu Utama</h1>
    <div class="card">
      <p style="text-align:center; color:#555;">Selamat datang di Aplikasi Pendataan Warga.</p>
      <button class="menu-btn" onclick="bukaHalaman('formInput')">➕ Isi Data Warga</button>
      <button class="menu-btn-2" onclick="bukaHalaman('cekData')">🔍 Cek Data Warga</button>
    </div>
  </div>

  <!-- ================= FORM INPUT ================= -->
  <div id="formInput" class="hidden">
    <h1>➕ Isi Data Warga</h1>
    <div class="card">
      <form id="formWarga" onsubmit="simpanData(event)">
        <label>Nomor KK</label>
        <input type="number" id="noKK" placeholder="16 Digit No. KK" required>

        <label>NIK</label>
        <input type="number" id="nik" placeholder="16 Digit NIK" required>

        <label>Nama Sesuai KTP/KK</label>
        <input type="text" id="nama" placeholder="Nama Lengkap" required>

        <label>Status</label>
        <select id="status" required>
          <option value="">-- Pilih Status --</option>
          <option value="Kepala Keluarga">Kepala Keluarga</option>
          <option value="Istri/Suami">Istri/Suami</option>
          <option value="Anak">Anak</option>
          <option value="Famili Lain">Famili Lain</option>
        </select>

        <label>Keterangan</label>
        <input type="text" id="keterangan" placeholder="Contoh: Warga Baru, Pindah, dll">

        <button type="submit" id="btnSimpan">Simpan ke Database</button>
        <div class="success" id="pesanSukses">✅ Data berhasil disimpan!</div>
      </form>
      <button class="menu-btn-2" onclick="bukaHalaman('dashboard')" style="margin-top:20px;">⬅️ Kembali ke Menu</button>
    </div>
  </div>

  <!-- ================= CEK DATA ================= -->
  <div id="cekData" class="hidden">
    <h1>🔍 Cek Data Warga</h1>
    <div class="card">
      
      <div style="display:flex; gap:10px;">
        <input type="text" id="inputCari" placeholder="Cari nama warga..." onkeyup="cariData()">
      </div>
      
      <div style="display:flex; gap:10px; margin-top: 10px;">
        <button onclick="muatData()" id="btnMuat">🔄 Tarik Data dari Sheets</button>
        <button onclick="downloadPDF()" style="background:#cf222e;">📄 Download PDF</button>
      </div>

      <div style="overflow-x:auto;">
        <table id="tabelWarga">
          <thead>
            <tr>
              <th>Nama</th>
              <th>NIK</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bodyTabel">
            <tr><td colspan="3" style="text-align:center;">Belum ada data. Klik tombol Tarik Data.</td></tr>
          </tbody>
        </table>
      </div>
      
      <button class="menu-btn-2" onclick="bukaHalaman('dashboard')" style="margin-top:20px;">⬅️ Kembali ke Menu</button>
    </div>
  </div>

<script>
  // GANTI DENGAN URL WEB APP KAMU
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw4tO_pDQBi09t_VhJWThxjYuri3EF6cThsRH4jhYMjAp5m37bxd-bsgxSbdHYyEan7wQ/exec";
  
  let semuaDataWarga = []; // Menyimpan data sementara di memori HP

  // Fungsi Navigasi Menu
  function bukaHalaman(idHalaman) {
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('formInput').classList.add('hidden');
    document.getElementById('cekData').classList.add('hidden');
    
    document.getElementById(idHalaman).classList.remove('hidden');
    
    // Jika buka cek data, otomatis tarik data terbaru
    if(idHalaman === 'cekData') {
      muatData();
    }
  }

  // ================= FUNGSI SIMPAN DATA =================
  function simpanData(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSimpan');
    const pesan = document.getElementById('pesanSukses');
    
    const data = {
      noKK: document.getElementById('noKK').value,
      nik: document.getElementById('nik').value,
      nama: document.getElementById('nama').value,
      status: document.getElementById('status').value,
      keterangan: document.getElementById('keterangan').value || "-"
    };

    btn.innerText = "Menyimpan...";
    btn.disabled = true;

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      if(result.status === "success") {
        pesan.style.display = "block";
        document.getElementById('formWarga').reset();
        setTimeout(() => { pesan.style.display = "none"; }, 3000);
      }
    })
    .catch(error => alert("Gagal menyimpan. Cek koneksi internet."))
    .finally(() => { btn.innerText = "Simpan ke Database"; btn.disabled = false; });
  }

  // ================= FUNGSI TARIK DATA (GET) =================
  function muatData() {
    const btn = document.getElementById('btnMuat');
    const bodyTabel = document.getElementById('bodyTabel');
    
    btn.innerText = "Memuat data...";
    btn.disabled = true;
    bodyTabel.innerHTML = `<tr><td colspan="3" style="text-align:center;">Menghubungi Google Sheets...</td></tr>`;

    fetch(GAS_URL)
      .then(response => response.json())
      .then(data => {
        semuaDataWarga = data; // Simpan ke variabel global
        renderTabel(semuaDataWarga);
      })
      .catch(error => {
        bodyTabel.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Gagal memuat data. Pastikan URL benar.</td></tr>`;
      })
      .finally(() => {
        btn.innerText = "🔄 Tarik Data dari Sheets";
        btn.disabled = false;
      });
  }

  // Tampilkan data ke Tabel HTML
  function renderTabel(data) {
    const bodyTabel = document.getElementById('bodyTabel');
    bodyTabel.innerHTML = "";
    
    if(data.length === 0) {
      bodyTabel.innerHTML = `<tr><td colspan="3" style="text-align:center;">Data kosong.</td></tr>`;
      return;
    }

    // Tampilkan terbalik (data terbaru di atas)
    data.reverse().forEach(warga => {
      bodyTabel.innerHTML += `
        <tr>
          <td><b>${warga.nama}</b><br>KK: ${warga.noKK}</td>
          <td>${warga.nik}</td>
          <td>${warga.status}</td>
        </tr>
      `;
    });
  }

  // ================= FUNGSI PENCARIAN =================
  function cariData() {
    const kataKunci = document.getElementById('inputCari').value.toLowerCase();
    const hasilFilter = semuaDataWarga.filter(warga => 
      warga.nama.toLowerCase().includes(kataKunci)
    );
    renderTabel(hasilFilter);
  }

  // ================= FUNGSI DOWNLOAD PDF =================
    function downloadPDF() {
    if(semuaDataWarga.length === 0) {
      alert("Belum ada data untuk didownload.");
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("Laporan Data Warga", 14, 15);

    const tableData = semuaDataWarga.map(warga => [
      warga.nama, warga.nik, warga.noKK, warga.status, warga.keterangan
    ]);

    doc.autoTable({
      head: [['Nama', 'NIK', 'No KK', 'Status', 'Keterangan']],
      body: tableData,
      startY: 20,
    });

    // Cek apakah aplikasi berjalan di Android (WebView)
    if (window.AndroidDownloader) {
      // Ubah PDF jadi teks Base64, lalu kirim ke Android
      const pdfBase64 = doc.output('datauristring').split(',')[1];
      window.AndroidDownloader.savePdf(pdfBase64, "Data_Warga.pdf");
    } else {
      // Jika dibuka di browser biasa (untuk testing)
      doc.save('Data_Warga.pdf');
    }
  }
</script>
</body>
</html>
